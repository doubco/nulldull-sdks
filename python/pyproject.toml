[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nulldull"
version = "0.1.0"
description = "Official NullDull SDK for Python: Grid published content, read-only Memory and Locale export with workspace API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "NullDull" }]
keywords = ["nulldull", "sdk", "grid", "memory", "locale", "i18n", "cms", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.urls]
Homepage = "https://nulldull.com/docs"
Documentation = "https://nulldull.com/docs"
Repository = "https://github.com/doubco/nulldull-sdks"
Source = "https://github.com/doubco/nulldull-sdks/tree/main/python"
Issues = "https://github.com/doubco/nulldull-sdks/issues"
Changelog = "https://github.com/doubco/nulldull-sdks/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/nulldull"]

[tool.hatch.build.targets.sdist]
only-include = ["src/nulldull", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src/nulldull"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
